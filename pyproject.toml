[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-underwriting-monitoring-pack"
version = "0.1.0"
description = "Illustrative commercial credit underwriting and monitoring"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "matplotlib", "openpyxl", "python-docx"]

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
